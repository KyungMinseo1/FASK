name: Validate applications

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop CI
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Test release validation rules
        run: node --test ../.github/scripts/check-release.test.cjs
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Intentionally do not install desktop dependencies or consume desktop outputs.
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: npm ci
      - run: npm run sync
      - name: Test native code and build Debug APK
        working-directory: mobile/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
