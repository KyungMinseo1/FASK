name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check branch membership and application versions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/check-release.cjs

  validate:
    needs: guard
    uses: ./.github/workflows/validate.yml

  windows-release:
    name: Package Windows installer
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx --no-install electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Package signed Android APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      # Release builds do not restore caches written by PR jobs.
      - run: npm ci
      - run: npm run sync
      - name: Restore signing key, build and verify APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fask-release.jks
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Release environment secret: $name"
              exit 1
            fi
          done
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          expected=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':\r')
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo '::error::APK signer does not match the configured keystore certificate'
            exit 1
          fi
          mkdir -p ../../release-assets
          cp "$apk" "../../release-assets/fask-${RELEASE_TAG#v}-android.apk"
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fask-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [guard, windows-release, android-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets
      - name: Create draft, upload both installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(release-assets/*-setup.exe)
          android=(release-assets/*-android.apk)
          [[ ${#windows[@]} == 1 && ${#android[@]} == 1 ]] || { echo '::error::Expected one Windows installer and one Android APK'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) { console.error("Refusing to overwrite a published release"); process.exit(1) }'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "FASK $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${windows[@]}" "${android[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
